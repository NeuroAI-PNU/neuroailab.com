<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
    <marker id="arg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#888"/></marker>
  </defs>
  <rect width="1400" height="760" fill="#ffffff"/>

  <!-- top loop: neuroscience <-> machine intelligence via RL -->
  <text x="700" y="58" text-anchor="middle" font-size="34" font-weight="bold" fill="#222">Neural microcircuit based constraint</text>
  <path d="M 330 200 Q 700 60 1070 200" fill="none" stroke="#222" stroke-width="14" marker-end="url(#ar)"/>
  <path d="M 1070 470 Q 700 610 330 470" fill="none" stroke="#222" stroke-width="14" marker-end="url(#ar)"/>
  <text x="700" y="595" text-anchor="middle" font-size="34" font-weight="bold" fill="#222">Algorithmic perspective</text>

  <!-- left: brain (neuroscience) -->
  <g transform="translate(90,220)">
    <path d="M120,20 C60,10 20,60 30,110 C0,140 10,200 50,215 C60,260 130,270 160,240 C190,270 250,250 240,200 C280,180 270,110 230,95 C240,40 170,10 120,20 Z" fill="none" stroke="#F0A94A" stroke-width="12" stroke-linejoin="round"/>
    <path d="M120,20 C130,80 110,150 160,240 M60,110 C100,120 130,100 150,130 M200,90 C180,130 200,170 230,180" fill="none" stroke="#F0A94A" stroke-width="8" stroke-linecap="round"/>
    <text x="150" y="150" text-anchor="middle" font-size="30" font-weight="bold" fill="#222">Neuro</text>
    <text x="150" y="185" text-anchor="middle" font-size="30" font-weight="bold" fill="#222">science</text>
  </g>

  <!-- center: RL gear -->
  <g transform="translate(700,335)">
    <g fill="none" stroke="#3FA36B" stroke-width="12">
      <circle r="78"/>
      <g id="tooth"><rect x="-16" y="-112" width="32" height="40" rx="4"/></g>
      <use href="#tooth" transform="rotate(45)"/><use href="#tooth" transform="rotate(90)"/><use href="#tooth" transform="rotate(135)"/>
      <use href="#tooth" transform="rotate(180)"/><use href="#tooth" transform="rotate(225)"/><use href="#tooth" transform="rotate(270)"/><use href="#tooth" transform="rotate(315)"/>
    </g>
    <text y="16" text-anchor="middle" font-size="52" font-weight="bold" fill="#222">RL</text>
  </g>

  <!-- right: circuit brain (machine intelligence) -->
  <g transform="translate(1010,220)" fill="none" stroke="#5BD0F0" stroke-width="12" stroke-linejoin="round" stroke-linecap="round">
    <path d="M40,40 L140,20 L240,60 L270,140 L250,220 L170,260 L80,240 L30,170 Z"/>
    <path d="M40,40 L100,110 L60,170 M140,20 L150,110 L210,150 L200,220 M100,110 L170,120 M80,240 L120,180"/>
    <g fill="#5BD0F0" stroke="none"><circle cx="100" cy="110" r="11"/><circle cx="60" cy="170" r="11"/><circle cx="150" cy="110" r="11"/><circle cx="210" cy="150" r="11"/><circle cx="200" cy="220" r="11"/><circle cx="170" cy="120" r="11"/><circle cx="120" cy="180" r="11"/></g>
    <text x="150" y="150" text-anchor="middle" font-size="26" font-weight="bold" fill="#222" stroke="none">Machine</text>
    <text x="150" y="182" text-anchor="middle" font-size="26" font-weight="bold" fill="#222" stroke="none">Intelligence</text>
  </g>

  <!-- bottom band: multiscale axis -->
  <g transform="translate(0,690)">
    <line x1="120" y1="0" x2="1280" y2="0" stroke="#888" stroke-width="4" marker-end="url(#arg)"/>
    <!-- molecule / drug -->
    <g transform="translate(150,-2)">
      <g fill="none" stroke="#B05CD6" stroke-width="5"><polygon points="0,-22 19,-11 19,11 0,22 -19,11 -19,-11"/><line x1="19" y1="-11" x2="40" y2="-22"/><circle cx="48" cy="-26" r="7" fill="#B05CD6" stroke="none"/></g>
      <text y="52" text-anchor="middle" font-size="18" fill="#444">molecule · drug</text>
    </g>
    <!-- ion channel in membrane -->
    <g transform="translate(400,-2)">
      <g fill="none" stroke="#B05CD6" stroke-width="5"><line x1="-50" y1="-14" x2="-14" y2="-14"/><line x1="-50" y1="14" x2="-14" y2="14"/><line x1="14" y1="-14" x2="50" y2="-14"/><line x1="14" y1="14" x2="50" y2="14"/><rect x="-14" y="-24" width="10" height="48" rx="3"/><rect x="4" y="-24" width="10" height="48" rx="3"/></g>
      <text y="52" text-anchor="middle" font-size="18" fill="#444">ion channel · synapse</text>
    </g>
    <!-- neuron -->
    <g transform="translate(660,-2)" fill="none" stroke="#F0A94A" stroke-width="5" stroke-linecap="round">
      <circle r="14"/><path d="M-10,-10 L-34,-30 M-12,8 L-36,24 M10,-10 L30,-32 M14,0 L80,0 M80,0 L92,-10 M80,0 L92,10"/>
      <text y="52" text-anchor="middle" font-size="18" fill="#444" stroke="none">neuron</text>
    </g>
    <!-- network -->
    <g transform="translate(920,-2)" fill="none" stroke="#3FA36B" stroke-width="4">
      <path d="M-40,-18 L0,-22 L40,-18 M-40,18 L0,22 L40,18 M-40,-18 L0,22 M-40,18 L0,-22 M0,-22 L40,18 M0,22 L40,-18"/>
      <g fill="#3FA36B" stroke="none"><circle cx="-40" cy="-18" r="7"/><circle cx="-40" cy="18" r="7"/><circle cx="0" cy="-22" r="7"/><circle cx="0" cy="22" r="7"/><circle cx="40" cy="-18" r="7"/><circle cx="40" cy="18" r="7"/></g>
      <text y="52" text-anchor="middle" font-size="18" fill="#444" stroke="none">network · circuit</text>
    </g>
    <!-- behavior / patient -->
    <g transform="translate(1180,-2)" fill="none" stroke="#5BD0F0" stroke-width="5" stroke-linecap="round">
      <circle cy="-16" r="9"/><path d="M0,-7 L0,14 M-14,0 L14,0 M0,14 L-10,30 M0,14 L10,30"/>
      <text y="52" text-anchor="middle" font-size="18" fill="#444" stroke="none">behavior · patient</text>
    </g>
  </g>
  <text x="700" y="632" text-anchor="middle" font-size="20" fill="#666">Multiscale modeling · AI drug discovery</text>
</svg>
